<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Becoming</title><link rel="stylesheet" href="shell.css"></head>
<body><main><p class="eyebrow">BECOMING / DEVELOPMENT SHELL</p><h1>成为更好的自己</h1><p>桌面端连接验证入口 · 非正式产品界面</p>
<p id="status" role="status">正在检查本地服务…</p><button id="refresh">重新检查</button>
<form id="config"><h2>模型配置</h2><label>Base URL<input name="base_url" type="url" required placeholder="https://api.example.com/v1"></label>
<label>模型名称<input name="model" required></label><label>API Key<input name="api_key" type="password" autocomplete="off" placeholder="同一地址可留空以沿用当前密钥"></label>
<label class="check"><input name="persist" type="checkbox"> 使用系统安全存储保存配置</label><button type="button" id="test">测试连接</button> <button type="submit">应用配置</button>
<p id="model-status" role="status"></p></form></main><script src="shell.js"></script></body></html>
