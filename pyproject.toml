[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "becoming-agent"
version = "0.1.0"
description = "A minimal AI companion research prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
becoming = "becoming.__main__:main"

[tool.setuptools.packages.find]
include = ["becoming*"]
