[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "becoming-agent"
version = "0.1.0"
description = "A minimal AI companion research prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
becoming = "becoming.__main__:main"
becoming-api = "becoming.api:run"

[tool.setuptools.packages.find]
include = ["becoming*"]
