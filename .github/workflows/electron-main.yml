name: Electron main integration
on:
  push:
    paths: ['desktop/**', 'becoming/**', '.github/workflows/electron-main.yml', 'pyproject.toml']
  pull_request:
    paths: ['desktop/**', 'becoming/**', '.github/workflows/electron-main.yml', 'pyproject.toml']
permissions:
  contents: read
jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e .
      - run: npm test
        working-directory: desktop
  electron-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e .
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Run actual Electron under Xvfb with Chromium sandbox enabled
        working-directory: desktop
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm run test:electron
