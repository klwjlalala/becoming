name: Functional tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and API dependencies
        run: python -m pip install -e .
      - name: Run deterministic functional tests
        run: python -m unittest discover -s tests -v
      - name: Validate effect evaluation scaffold (offline)
        run: python -m evaluation
      - name: Validate longitudinal quality fixtures (offline)
        run: python -m evaluation.memory_quality
      - name: Validate integrated service-loop fixtures (offline)
        run: python -m evaluation.service_loop
      - name: Validate personal understanding longitudinal fixture (offline)
        run: python -m evaluation.personal_understanding
