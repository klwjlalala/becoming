name: Desktop service integration

on:
  push:
    paths:
      - 'becoming/**'
      - 'desktop/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-service.yml'
  pull_request:
    paths:
      - 'becoming/**'
      - 'desktop/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: node --test desktop/test/becoming-service.test.mjs
