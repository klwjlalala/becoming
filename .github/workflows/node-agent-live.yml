name: Node agent real-model acceptance
on:
  push:
    branches: [feat/local-agent-web, feat/ai-friend-web-v1]
    paths: ['.github/workflows/node-agent-live.yml']
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [web-smoke, functional, longitudinal, scenarios, long-session, acceptance]
        default: web-smoke
permissions:
  contents: read
concurrency:
  group: node-agent-live-acceptance
  cancel-in-progress: false
jobs:
  live:
    if: github.ref == 'refs/heads/feat/local-agent-web' || github.ref == 'refs/heads/feat/ai-friend-web-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: npm --prefix agent-runtime test
      - name: Run against configured real model
        env:
          BECOMING_BASE_URL: ${{ secrets.BECOMING_BASE_URL }}
          BECOMING_API_KEY: ${{ secrets.BECOMING_API_KEY }}
          BECOMING_MODEL: ${{ secrets.BECOMING_MODEL }}
          SUITE: ${{ inputs.suite || 'web-smoke' }}
          LONG_SESSION_PUSH: ${{ github.event_name == 'push' && github.event.head_commit.message == 'test: evaluate AI friend long session' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LONG_SESSION_PUSH" == "true" ]]; then SUITE=long-session; fi
          for k in BECOMING_BASE_URL BECOMING_API_KEY BECOMING_MODEL; do
            if [[ -z "${!k}" ]]; then echo "::error::Missing repository secret: $k"; exit 1; fi
          done
          python -m uvicorn server.app:app --host 127.0.0.1 --port 8000 >/tmp/becoming-gateway.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true' EXIT
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          if [[ "$SUITE" == web-smoke ]]; then
            npm --prefix agent-runtime run test:web-smoke
          elif [[ "$SUITE" == long-session ]]; then
            BECOMING_EFFECT_MODE=long-session BECOMING_REPORT=artifacts/node-effects-long-session.json npm --prefix agent-runtime run evaluate:live
          elif [[ "$SUITE" == acceptance ]]; then
            npm --prefix agent-runtime run test:live
            BECOMING_REPORT=artifacts/node-effects-scenarios.json BECOMING_EFFECT_MODE=scenarios npm --prefix agent-runtime run evaluate:live
            BECOMING_REPORT=artifacts/node-effects-longitudinal.json BECOMING_EFFECT_MODE=longitudinal npm --prefix agent-runtime run evaluate:live
          elif [[ "$SUITE" == functional ]]; then
            npm --prefix agent-runtime run test:live
          else
            BECOMING_EFFECT_MODE="$SUITE" npm --prefix agent-runtime run evaluate:live
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-agent-acceptance-report
          path: agent-runtime/artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
