name: Local agent web tests
on:
  push:
    branches: [feat/local-agent-web, feat/ai-friend-web-v1]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . httpx
      - run: node --check web/app.js
      - run: node --check agent-runtime/server.mjs
      - run: npm --prefix agent-runtime test
      - run: npm --prefix agent-runtime run test:effects
      - run: python -m unittest server.test_gateway -v
      - run: python server/smoke_local.py
