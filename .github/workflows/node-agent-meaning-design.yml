name: Node agent meaning-design acceptance
# Keep prompt, artifact-lifecycle, and replay-analysis changes covered by live acceptance.
on:
  push:
    branches:
      - feat/agent-capabilities-v1
    paths:
      - 'agent-runtime/validation/meaning-design-acceptance.mjs'
      - 'agent-runtime/validation/replay-analysis.mjs'
      - 'agent-runtime/agent.mjs'
      - 'server/app.py'
      - 'agent-runtime/validation/fixtures/meaning-design-*'
      - 'agent-runtime/package.json'
      - 'agent-runtime/prompt.mjs'
      - 'agent-runtime/test/**'
      - '.github/workflows/node-agent-meaning-design.yml'
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'Maximum model calls for the acceptance run'
        type: number
        required: false
        default: 24
permissions:
  contents: read
concurrency:
  group: node-agent-meaning-design-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway dependencies
        run: python -m pip install -e .
      - name: Run deterministic regression suite
        run: npm --prefix agent-runtime test
      - name: Verify model secrets
        env:
          BECOMING_BASE_URL: ${{ secrets.BECOMING_BASE_URL }}
          BECOMING_API_KEY: ${{ secrets.BECOMING_API_KEY }}
          BECOMING_MODEL: ${{ secrets.BECOMING_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          for key in BECOMING_BASE_URL BECOMING_API_KEY BECOMING_MODEL; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing repository secret: $key"; exit 1; fi
          done
      - name: Start model gateway
        env:
          BECOMING_BASE_URL: ${{ secrets.BECOMING_BASE_URL }}
          BECOMING_API_KEY: ${{ secrets.BECOMING_API_KEY }}
          BECOMING_MODEL: ${{ secrets.BECOMING_MODEL }}
        run: |
          python -m uvicorn server.app:app --host 127.0.0.1 --port 8000 >/tmp/becoming-gateway.log 2>&1 &
          echo $! > /tmp/becoming-gateway.pid
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then exit 0; fi
            sleep .2
          done
          cat /tmp/becoming-gateway.log
          exit 1
      - name: Run multi-turn meaning-design acceptance
        env:
          BECOMING_GATEWAY: http://127.0.0.1:8000
          MEANING_DESIGN_MAX_CALLS: ${{ inputs.max_calls || 24 }}
          MEANING_DESIGN_REPORT: artifacts/meaning-design-agent-acceptance.json
        run: |
          npm --prefix agent-runtime run evaluate:meaning-design || status=$?
          if [[ ${status:-0} -ne 0 ]] && grep -q 'Gateway structured stream HTTP 502' agent-runtime/artifacts/meaning-design-agent-acceptance.json; then
            echo "Transient gateway 502 detected; retrying the live acceptance once."
            sleep 5
            npm --prefix agent-runtime run evaluate:meaning-design
          else
            exit ${status:-0}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-agent-meaning-design-acceptance
          path: agent-runtime/artifacts/meaning-design-agent-acceptance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop model gateway
        if: always()
        run: |
          if [[ -f /tmp/becoming-gateway.pid ]]; then kill "$(cat /tmp/becoming-gateway.pid)" 2>/dev/null || true; fi
