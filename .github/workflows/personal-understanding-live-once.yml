name: Personal understanding live evaluation (manual)

# Re-run after date-aware fixture replay, evidence-lineage, and retrieval-suppression fixes.
# A push to this branch with the dedicated trigger commit message runs the one-shot live evaluation.

on:
  push:
    branches:
      - feat/dynamic-personal-understanding-v1
    paths:
      - '.github/workflows/personal-understanding-live-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-understanding-live-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.ref == 'refs/heads/feat/dynamic-personal-understanding-v1' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'run personal understanding 30-turn live evaluation once 2026-11-26')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate longitudinal fixture without model calls
        run: python -m evaluation.personal_understanding
      - name: Verify model configuration without exposing secrets
        env:
          BECOMING_BASE_URL: ${{ secrets.BECOMING_BASE_URL }}
          BECOMING_API_KEY: ${{ secrets.BECOMING_API_KEY }}
          BECOMING_MODEL: ${{ secrets.BECOMING_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in BECOMING_BASE_URL BECOMING_API_KEY BECOMING_MODEL; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing repository secret: $key"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "All required model configuration values are present."
      - name: Run 30-turn real-model longitudinal evaluation
        env:
          BECOMING_BASE_URL: ${{ secrets.BECOMING_BASE_URL }}
          BECOMING_API_KEY: ${{ secrets.BECOMING_API_KEY }}
          BECOMING_MODEL: ${{ secrets.BECOMING_MODEL }}
        run: |
          python -m evaluation.personal_understanding \
            --live \
            --max-calls 60 \
            --output artifacts/personal-understanding-live.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-understanding-live-evaluation
          path: artifacts/personal-understanding-live.json
          if-no-files-found: warn
          retention-days: 14
