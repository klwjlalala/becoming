name: Live companion quality evaluation (one-off)

on:
  push:
    branches:
      - feat/live-quality-evaluation-v1
    paths:
      - '.github/workflows/live-quality-evaluation-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-companion-quality-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.ref == 'refs/heads/feat/live-quality-evaluation-v1' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'run targeted live growth re-evaluation v4 once 2026-11-26')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate live evaluation fixtures without model calls
        run: python -m evaluation.live_quality --validate
      - name: Verify model configuration without exposing secrets
        env:
          BECOMING_BASE_URL: ${{ secrets.BECOMING_BASE_URL }}
          BECOMING_API_KEY: ${{ secrets.BECOMING_API_KEY }}
          BECOMING_MODEL: ${{ secrets.BECOMING_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in BECOMING_BASE_URL BECOMING_API_KEY BECOMING_MODEL; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing repository secret: $key"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "All required model configuration values are present."
      - name: Run real-model multi-turn quality scenarios
        env:
          BECOMING_BASE_URL: ${{ secrets.BECOMING_BASE_URL }}
          BECOMING_API_KEY: ${{ secrets.BECOMING_API_KEY }}
          BECOMING_MODEL: ${{ secrets.BECOMING_MODEL }}
        run: |
          python -m evaluation.live_quality \
            --live \
            --case growth-action-journey \
            --max-calls 15 \
            --output artifacts/live-growth-recheck-v4.json
      - name: Upload complete conversation and evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: becoming-live-growth-recheck-v4
          path: |
            artifacts/live-growth-recheck-v4.json
            artifacts/live-growth-recheck-v4.md
          if-no-files-found: warn
          retention-days: 14
